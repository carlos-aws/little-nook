name: Check and build
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  game:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Godot
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.7.2
          use-dotnet: false
          include-templates: true
      - name: Check game rules, saves, content and UI
        run: bash tools/check.sh
      - name: Export browser and Linux builds
        run: |
          bash tools/export.sh Web
          bash tools/export.sh Linux
      - uses: actions/upload-artifact@v4
        with:
          name: little-nook-web
          path: build/web/
      - uses: actions/upload-artifact@v4
        with:
          name: little-nook-linux
          path: build/linux/
